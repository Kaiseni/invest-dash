# Redirection http -> https
server {
    listen 80;
    server_name invest-dash.home.arpa;   # à adapter
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name invest-dash.home.arpa;   # à adapter

    # Certificat auto-signé (voir DEPLOY.md) ou certificat de votre domaine
    ssl_certificate     /etc/nginx/ssl/invest-dash.crt;
    ssl_certificate_key /etc/nginx/ssl/invest-dash.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Les comptes protègent les données, mais limiter l'accès au réseau local (ou à un VPN) reste recommandé.
    allow 192.168.1.0/24;                # à adapter à votre réseau
    deny all;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;      # on n'accepte pas un en-tête fourni par le client
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
